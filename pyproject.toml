[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-presenter"
version = "2.3.0"
description = "Scene: dual-screen presentations, Canva, images and video for Windows"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<6.13", "PyMuPDF>=1.25,<2", "pywin32>=308; sys_platform == 'win32'", "pywebview>=6.2.1,<7; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "pyinstaller>=6.11,<7", "ruff>=0.9,<1"]

[project.gui-scripts]
pdf-presenter = "pdf_presenter.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdf_presenter = ["resources/icons/*.ico", "resources/icons/*.png", "resources/icons/*.svg", "resources/*.js", "resources/locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
